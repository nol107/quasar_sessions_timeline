<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Tests</title>
<style>body{font:14px system-ui;margin:2rem;background:#111;color:#eee}.ok{color:#4ade80}.ko{color:#f87171}pre{margin:.2rem 0 .6rem 1rem;color:#aaa}</style></head>
<body><h1>Tests — rétroplanning EP.2</h1><div id="out"></div>
<script type="module">
import { run } from './tests/cases.js';
const out = document.getElementById('out'); let n = 0, fail = 0;
run({ eq(name, a, b) {
  n++; const ok = JSON.stringify(a) === JSON.stringify(b); if (!ok) fail++;
  out.insertAdjacentHTML('beforeend', `<div class="${ok ? 'ok' : 'ko'}">${ok ? '✓' : '✗'} ${name}</div>` +
    (ok ? '' : `<pre>reçu ${JSON.stringify(a)}\nattendu ${JSON.stringify(b)}</pre>`));
}});
out.insertAdjacentHTML('afterbegin', `<h2 class="${fail ? 'ko' : 'ok'}">${n - fail}/${n} OK</h2>`);
</script></body></html>
