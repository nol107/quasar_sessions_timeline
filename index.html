<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#121214">
  <title>Rétroplanning EP.2</title>
  <meta name="description" content="Rétroplanning de la sortie de QUASAR SESSIONS EP.2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23121214'/%3E%3Crect x='9' y='9' width='14' height='14' transform='rotate(45 16 16)' fill='none' stroke='%23ffffff' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://docs.google.com">
  <link rel="preconnect" href="https://drive.google.com">
  <link rel="preconnect" href="https://w.soundcloud.com">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#list">Aller aux tâches</a>

  <header class="hdr">
    <div class="hd-title">
      <p class="kicker">Maison Quasar · Rétroplanning</p>
      <h1>Quasar Sessions EP.2</h1>
    </div>
    <div id="hdr-info" class="countdowns"></div>
    <div class="tools">
      <button type="button" id="save" class="btn sm" hidden>Enregistrer</button>
      <button type="button" id="sync" class="sync" aria-live="polite"></button>
      <button type="button" id="btn-settings" class="btn sm" aria-label="Réglages">Réglages</button>
    </div>
  </header>

  <nav id="cats" class="cats" aria-label="Catégories"></nav>
  <nav id="filters" class="filters" aria-label="Filtres"></nav>

  <section id="timeline" aria-label="Frise"></section>

  <main id="list"></main>

  <div id="toasts" role="status" aria-live="polite"></div>

  <dialog id="overlay" class="overlay" aria-label="Ressource">
    <div class="ov-bar">
      <strong id="ov-title"></strong>
      <a id="ov-open" class="btn sm" target="_blank" rel="noopener noreferrer">Nouvel onglet ↗</a>
      <button type="button" class="btn sm" id="ov-close" aria-label="Fermer">Fermer</button>
    </div>
    <p id="ov-hint" class="ov-hint" hidden>Si rien ne s'affiche, ce site refuse l'intégration → <a id="ov-open2" target="_blank" rel="noopener noreferrer">ouvrir dans un nouvel onglet</a>.</p>
    <p id="ov-loading" class="ov-loading">Chargement…</p>
    <iframe id="ov-frame" title="Ressource" allow="autoplay" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </dialog>

  <dialog id="panel" class="panel" aria-label="Détail de la tâche"></dialog>

  <dialog id="settings" class="dlg"></dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
